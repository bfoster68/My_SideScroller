<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Side-Scroller</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        #bevy-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #bevy-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="bevy-container">
        <canvas id="bevy-canvas"></canvas>
    </div>
    <link data-trunk rel="copy-dir" href="assets" />
</body>
</html>
